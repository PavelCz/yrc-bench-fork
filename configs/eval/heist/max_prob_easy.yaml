# Easy-mode variant of configs/eval/heist/max_prob.yaml.
#
# Used with scripts/run_eval_policy.py --config to evaluate acting policies
# trained with --distribution-mode easy. The only difference from max_prob.yaml
# is distribution_mode: 'easy' on every split.
#
# Why this matters: the per-level reward cap in heist is
# min(num_keys, total_chests), drawn from difficulty + randn(2) + 1 where
# difficulty ~ U{0..max_diff} and max_diff = (world_dim - 5) / 2. world_dim is
# 13 in hard mode and 9 in easy mode, so the mean cap is 3.5 (hard) vs 2.5
# (easy). Returns are therefore NOT comparable across distribution modes.
#
# Pass -random_percent 0 for ID-only (many_chests) or 100 for OOD-only
# (many_keys); run_eval_policy.py overrides environment.test.random_percent.

# General settings
general:
    benchmark: 'procgen'
    algorithm: 'threshold'
    seed: 1

# Wandb settings
wandb:
    project: 'yrc-01'


# Evaluation settings
evaluation:
    coverage_fraction: 0.025
    threshold_sampler: 'level_afhp'
    video_episodes_to_collect: 16
    video_filter: ['all']

# Inherit all settings from common.yaml
environment:
    common:
        env_name: 'heist_afh'
        normalize_rew: False
        num_envs: 8
        num_threads: 8
        use_backgrounds: True
        use_monochrome_assets: False
        restrict_themes: False
    train:
        distribution_mode: 'easy'
        seed: 0
        start_level: 0
        num_levels: 100000
        random_percent: 0
    val_sim:
        distribution_mode: 'easy'
        seed: 100000
        start_level: 100000
        num_levels: 256
        random_percent: 50
    val_true:
        distribution_mode: 'easy'
        seed: 200000
        start_level: 200000
        num_levels: 256
        random_percent: 50
    test:
        distribution_mode: 'easy'
        seed: 300000
        start_level: 300000
        num_levels: 5120
        random_percent: 50
coord_env: null
coord_policy:
    cls: ThresholdPolicy
    feature_type: 'obs'
    collect_data_agent: 'weak'
    metric: 'max_prob'
algorithm: null
